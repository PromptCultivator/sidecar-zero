apiVersion: v2
name: sidecarzero
description: >-
  A library chart that adds the SidecarZero sidecar to your own pods: a KEP-753 native sidecar
  (or a classic container), its volumes, and the host container's environment
  (kubernetes-deploy §3). Include its named templates in your pod spec.
type: library
version: 0.1.1
appVersion: "0.1.1"
