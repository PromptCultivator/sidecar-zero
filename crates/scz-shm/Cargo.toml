[package]
name = "scz-shm"
description = "The SidecarZero arena: layout, rings, slots, and the waits between them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each tagged store becomes a place a test can kill the process (testing §2.4). Off in builds.
crashpoints = []
# The upgrade test's next minor version (shm-abi §12.5): ABI_MINOR + 1, and every allowance a
# 1.0 reader must tolerate used: reserved bytes filled, a completion ring appended to the data
# segment, unknown feature and HELLO flag bits set. Never in a release.
next-minor = []

[dependencies]
libc.workspace = true
xxhash-rust.workspace = true

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[lints]
workspace = true
