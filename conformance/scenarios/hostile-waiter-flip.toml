name = "a hostile worker flips every slot's WAITER bit continuously: every slot CAS loop stays bounded"

# A targeted pattern of testing §3, "Hostile worker": every slot word's WAITER bit flipped
# without pause, so any CAS on a slot word can fail and a parked caller can be woken or left
# asleep. Every call must return within its bound, and the agent must survive.
# Then the sidecar is restarted on a clean script, and every assertion holds again.
# A hostile worker can clear a WAITER bit and so lose a wake-up: late wake-ups are expected.
stall = true

[sidecar]
args = ["--model={dir}/model"]
start = false

[agent]
threads = 4
budget_us = 2000

[[step]]
do = "write"
path = "model"
text = "SCZCHAOS-SCRIPT\nflip_waiter=1\n"

[[step]]
do = "start_sidecar"

[[step]]
do = "bound"

[[step]]
do = "call"
count = 20000
hostile = true

[[step]]
do = "write"
path = "model"
text = "SCZCHAOS-SCRIPT\n"

[[step]]
do = "restart_sidecar"

[[step]]
do = "bound"
ms = 20000

# Ordinary traffic again, with the ordinary budget.
[[step]]
do = "call"
count = 200
budget_us = 20000
