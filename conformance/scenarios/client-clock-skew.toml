name = "a cheap clock that drifts from CLOCK_MONOTONIC: CLOCK_FAULT until the SDK recalibrates"
needs = ["cheap-clock"]
covers = ["CLOCK_FAULT"]

# The SDK re-verifies its clock at least once a second and falls back with CLOCK_FAULT from
# the check that finds the drift until a later one has re-established the offset. 1 ms
# calls for three seconds cover at least one check.

[[step]]
do = "bound"

[[step]]
do = "clock_skew"
ns = 50000000

[[step]]
do = "call"
count = 3000
op = "delay"
arg = 1000
expect = "mixed"
reasons = ["CLOCK_FAULT"]
need = ["CLOCK_FAULT"]

[[step]]
do = "sleep"
ms = 3000

[[step]]
do = "call"
count = 100
