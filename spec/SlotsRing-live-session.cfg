\* Spec A, liveness with a thread that stops for ever after claiming a cell: the supervisor
\* must notice the stuck head and reset the session.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1}
    NCalls = 1
    NSlots = 2
    CAP = 2
    SpinIters = 0
    MaxWorkerCrashes = 0
    HostMayDie = FALSE
    MaxKills = 1
    MaxRequestedResets = 0
    Unwind = FALSE
    Bug = "none"
PROPERTIES
    CallsResolve
    StuckHeadClears
    AbandonedFreed
CHECK_DEADLOCK FALSE
