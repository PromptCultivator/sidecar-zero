\* Spec A, full ring: one thread makes three calls; those that time out leave their descriptors
\* queued, so the ring fills and laps, and the worker may crash at any step. The repair rule
\* then meets a freed cell that a producer has refilled.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1}
    NCalls = 3
    NSlots = 2
    CAP = 2
    SpinIters = 0
    MaxWorkerCrashes = 1
    HostMayDie = FALSE
    MaxKills = 0
    MaxRequestedResets = 0
    Unwind = FALSE
    Bug = "none"
INVARIANTS
    OneOwner
    OwnerMeaningful
    OneOutcome
    GateFollowsHolds
    ClientNotStranded
    ConsumerNotStranded
    RingUsable
    OwnedSwept
    NoOrphan
    NoLateQueued
    NoResetUnderClient
    ResetClean
CHECK_DEADLOCK FALSE
