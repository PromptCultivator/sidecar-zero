\* Spec B, scenario "changed": one worker failure (a death or a stall) at any step, and memory pressure that holds the gate.
SPECIFICATION Spec
CONSTANTS
    Scenario = "changed"
    MaxFailures = 1
    MaxRequests = 2
    NSlots = 2
    CAP = 2
    Pressure = TRUE
    ClientsCancel = TRUE
    Bug = "none"
INVARIANTS
    OneConsumer
    OneWriter
    BeatsDistinct
    ServedOnce
    HealthyOnlyWhenOpen
    GateFollowsHolds
CHECK_DEADLOCK FALSE
