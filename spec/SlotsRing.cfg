\* Spec A, worker crash: two threads, one call each, two slots, a ring of two, and one crash of
\* the active worker at any step, after which a successor takes over the ring.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    NCalls = 1
    NSlots = 2
    CAP = 2
    SpinIters = 0
    MaxWorkerCrashes = 1
    HostMayDie = FALSE
    MaxKills = 0
    MaxRequestedResets = 0
    Unwind = FALSE
    Bug = "none"
SYMMETRY Perms
VIEW View
INVARIANTS
    OneOwner
    OwnerMeaningful
    OneOutcome
    GateFollowsHolds
    ClientNotStranded
    ConsumerNotStranded
    RingUsable
    OwnedSwept
    NoOrphan
    NoLateQueued
    NoResetUnderClient
    ResetClean
CHECK_DEADLOCK FALSE
