\* Spec B, a clean same-schema handover: no failures, no cancels. Every queued request is served.
SPECIFICATION Spec
CONSTANTS
    Scenario = "same"
    MaxFailures = 0
    MaxRequests = 2
    NSlots = 2
    CAP = 2
    Pressure = FALSE
    ClientsCancel = FALSE
    Bug = "none"
INVARIANTS
    OneConsumer
    OneWriter
    ServedOnce
PROPERTIES
    QueuedServed
    HandoverEnds
CHECK_DEADLOCK FALSE
