\* Spec B, scenario "same": up to two worker failures (deaths or stalls) at any step; no memory pressure.
SPECIFICATION Spec
CONSTANTS
    Scenario = "same"
    MaxFailures = 2
    MaxRequests = 2
    NSlots = 2
    CAP = 2
    Pressure = FALSE
    ClientsCancel = TRUE
    Bug = "none"
INVARIANTS
    OneConsumer
    OneWriter
    BeatsDistinct
    ServedOnce
    HealthyOnlyWhenOpen
    GateFollowsHolds
CHECK_DEADLOCK FALSE
