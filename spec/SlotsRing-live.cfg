\* Spec A, liveness: two threads, one call each, no failures. Liveness runs use no symmetry
\* or view, under which TLC's liveness checking is not sound, so their bounds are small.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    NCalls = 1
    NSlots = 2
    CAP = 2
    SpinIters = 0
    MaxWorkerCrashes = 0
    HostMayDie = FALSE
    MaxKills = 0
    MaxRequestedResets = 0
    Unwind = FALSE
    Bug = "none"
PROPERTIES
    CallsResolve
    AbandonedFreed
    ConsumerWoken
CHECK_DEADLOCK FALSE
