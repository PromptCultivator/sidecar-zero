\* Spec A, liveness with a worker crash at any step: one thread, two calls. Abandoned slots of
\* the dead worker must still return to FREE, and every call must resolve.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1}
    NCalls = 2
    NSlots = 2
    CAP = 2
    SpinIters = 0
    MaxWorkerCrashes = 1
    HostMayDie = FALSE
    MaxKills = 0
    MaxRequestedResets = 0
    Unwind = FALSE
    Bug = "none"
PROPERTIES
    CallsResolve
    AbandonedFreed
    ConsumerWoken
CHECK_DEADLOCK FALSE
