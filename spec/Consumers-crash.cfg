\* Spec B, scenario "crash": up to two worker failures (deaths or stalls) at any step, and memory pressure that holds the gate.
SPECIFICATION Spec
CONSTANTS
    Scenario = "crash"
    MaxFailures = 2
    MaxRequests = 2
    NSlots = 2
    CAP = 2
    Pressure = TRUE
    ClientsCancel = TRUE
    Bug = "none"
INVARIANTS
    OneConsumer
    OneWriter
    BeatsDistinct
    ServedOnce
    HealthyOnlyWhenOpen
    GateFollowsHolds
CHECK_DEADLOCK FALSE
