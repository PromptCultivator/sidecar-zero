\* Spec A, session: the host may die at any step, one thread may stop for ever, the supervisor
\* may ask for a reset, and a producer may unwind between claiming and publishing its cell.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    NCalls = 1
    NSlots = 2
    CAP = 2
    SpinIters = 0
    MaxWorkerCrashes = 0
    HostMayDie = TRUE
    MaxKills = 1
    MaxRequestedResets = 1
    Unwind = TRUE
    Bug = "none"
SYMMETRY Perms
VIEW View
INVARIANTS
    OneOwner
    OwnerMeaningful
    OneOutcome
    GateFollowsHolds
    ClientNotStranded
    ConsumerNotStranded
    RingUsable
    OwnedSwept
    NoOrphan
    NoLateQueued
    NoResetUnderClient
    ResetClean
CHECK_DEADLOCK FALSE
