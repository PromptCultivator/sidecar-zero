\* Spec A, spinning: a waiting client checks the gate while it spins, then parks; the worker
\* may crash at any step.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    NCalls = 1
    NSlots = 2
    CAP = 2
    SpinIters = 1
    MaxWorkerCrashes = 1
    HostMayDie = FALSE
    MaxKills = 0
    MaxRequestedResets = 0
    Unwind = FALSE
    Bug = "none"
SYMMETRY Perms
VIEW View
INVARIANTS
    OneOwner
    OwnerMeaningful
    OneOutcome
    GateFollowsHolds
    ClientNotStranded
    ConsumerNotStranded
    RingUsable
    OwnedSwept
    NoOrphan
    NoLateQueued
    NoResetUnderClient
    ResetClean
CHECK_DEADLOCK FALSE
