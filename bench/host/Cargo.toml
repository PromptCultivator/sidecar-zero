[package]
name = "scz-bench-host"
description = "The benchmark's host: in-process load loop and service-mode HTTP app over every system (bench §4)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["triton"]
# System B, Triton over gRPC with system shared memory (bench/triton-client).
triton = ["dep:scz-bench-triton"]

[dependencies]
scz-bench-common = { path = "../common" }
scz-bench-triton = { path = "../triton-client", optional = true }
sidecarzero = { path = "../../sdks/rust" }
libc.workspace = true

[lints]
workspace = true
